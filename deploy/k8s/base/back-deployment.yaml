apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app: back
    app.kubernetes.io/name: pruebasopencode1-back
    app.kubernetes.io/part-of: pruebasopencode1
spec:
  # H2 en fichero no admite varias instancias sobre el mismo volumen.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
        app.kubernetes.io/name: pruebasopencode1-back
        app.kubernetes.io/part-of: pruebasopencode1
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: back
          image: pruebasopencode1-back:pre
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pruebasopencode1-config
            - secretRef:
                name: pruebasopencode1-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: back-data
        - name: tmp
          emptyDir: {}
