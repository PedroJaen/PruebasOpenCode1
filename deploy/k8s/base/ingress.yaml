# Ingress de ejemplo. Los overlays PRE/PRO sustituyen el host y añaden TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pruebasopencode1
  labels:
    app.kubernetes.io/name: pruebasopencode1
    app.kubernetes.io/part-of: pruebasopencode1
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: pruebasopencode1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 80
