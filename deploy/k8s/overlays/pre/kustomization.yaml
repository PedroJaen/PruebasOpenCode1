apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pruebasopencode1-pre

resources:
  - namespace.yaml
  - ../../base

images:
  - name: pruebasopencode1-back
    newTag: pre
  - name: pruebasopencode1-front
    newTag: pre

patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: pruebasopencode1-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: pruebasopencode1
