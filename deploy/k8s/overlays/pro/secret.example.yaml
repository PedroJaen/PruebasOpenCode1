# Secretos de ejemplo para PRO.
# NO se aplica automáticamente ni se versiona con valores reales.
#
#   kubectl apply -f deploy/k8s/overlays/pro/namespace.yaml
#   kubectl -n pruebasopencode1-pro create secret generic pruebasopencode1-secrets \
#     --from-literal=DB_USERNAME=sa \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=APP_AUTH_USERNAME='...' \
#     --from-literal=APP_AUTH_PASSWORD='...'
#
# Después: kubectl apply -k deploy/k8s/overlays/pro
apiVersion: v1
kind: Secret
metadata:
  name: pruebasopencode1-secrets
  namespace: pruebasopencode1-pro
type: Opaque
stringData:
  DB_USERNAME: sa
  DB_PASSWORD: cambia-esta-clave-pro
  APP_AUTH_USERNAME: demo
  APP_AUTH_PASSWORD: demo1234
