apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front
  labels:
    app: front
    app.kubernetes.io/name: pruebasopencode1-front
    app.kubernetes.io/part-of: pruebasopencode1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
