# Docker Compose de PruebasOpenCode1 para PRE y PRO.
#
# Uso:
#   Copy-Item deploy/docker/.env.pre.example deploy/docker/.env.pre
#   .\deploy\docker\levantar.ps1 -Entorno pre
#
# Los valores se leen de deploy/docker/.env.<entorno> mediante --env-file.
# Ese fichero contiene secretos reales y está excluido de Git.

name: pruebasopencode1-${ENTORNO:-pre}

services:
  back:
    build:
      context: ../..
      dockerfile: deploy/docker/back.Dockerfile
    image: pruebasopencode1-back:${ENTORNO:-pre}
    container_name: pruebasopencode1-back-${ENTORNO:-pre}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-pre}
      SERVER_PORT: "8080"
      DB_URL: ${DB_URL:-jdbc:h2:file:/app/data/pruebasopencode1}
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en deploy/docker/.env.<entorno>}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en deploy/docker/.env.<entorno>}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS en deploy/docker/.env.<entorno>}
      SEED_MOCK_DATA: "false"
      H2_CONSOLE_ENABLED: "false"
      SPRINGDOC_ENABLED: "false"
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?Define APP_AUTH_USERNAME en deploy/docker/.env.<entorno>}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Define APP_AUTH_PASSWORD en deploy/docker/.env.<entorno>}
      APP_AUTH_ROLE: ${APP_AUTH_ROLE:-USER}
      APP_AUTH_TOKEN_TTL: ${APP_AUTH_TOKEN_TTL:-10m}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACK_PORT:-8081}:8080"
    volumes:
      - back-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  front:
    build:
      context: ../..
      dockerfile: deploy/docker/front.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH_USERNAME: ${VITE_AUTH_USERNAME:?Define VITE_AUTH_USERNAME en deploy/docker/.env.<entorno>}
        VITE_AUTH_PASSWORD: ${VITE_AUTH_PASSWORD:?Define VITE_AUTH_PASSWORD en deploy/docker/.env.<entorno>}
    image: pruebasopencode1-front:${ENTORNO:-pre}
    container_name: pruebasopencode1-front-${ENTORNO:-pre}
    depends_on:
      back:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  back-data:
    name: pruebasopencode1-back-data-${ENTORNO:-pre}
