# Servidor web del frontend de PruebasOpenCode1.
# - Sirve los estáticos generados por Vite con fallback de SPA.
# - Proxifica /api/** hacia el servicio interno `back:8080`.
# - Escucha en 8080 para poder ejecutarse como usuario sin privilegios.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Sonda de salud propia del contenedor y de Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La SPA y la API comparten origen: no hace falta CORS para este tráfico.
    location /api/ {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Assets con hash: caché larga e inmutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # El index debe revalidarse para recoger nuevas versiones del bundle.
    location = /index.html {
        expires -1;
    }

    # Fallback de la aplicación React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
