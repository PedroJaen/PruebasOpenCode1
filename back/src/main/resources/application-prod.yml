spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Entorno PRO simulado en local. En un despliegue real, DB_URL apuntará a
    # la base de datos gestionada del entorno.
    url: ${DB_URL:jdbc:h2:file:./data/prod/pruebasopencode1-prod}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false

  h2:
    console:
      # Igual que en local: consola H2 disponible. Se puede desactivar con
      # H2_CONSOLE_ENABLED=false en entornos expuestos.
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        # En Docker/Kubernetes la petición llega desde la red interna, no desde
        # 127.0.0.1; el despliegue define H2_CONSOLE_ALLOW_OTHERS=true.
        web-allow-others: ${H2_CONSOLE_ALLOW_OTHERS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mock-data:
    # Igual que en local: si la base está vacía se siembran los 10 datos mock.
    seed-on-startup: ${SEED_MOCK_DATA:true}
  auth:
    username: ${APP_AUTH_USERNAME}
    password: ${APP_AUTH_PASSWORD}
    role: ${APP_AUTH_ROLE:USER}
    token-ttl: ${APP_AUTH_TOKEN_TTL:5m}

logging:
  level:
    com.pruebasopencode1: ${LOG_LEVEL:WARN}
