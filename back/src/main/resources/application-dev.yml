spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/pruebasopencode1}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  mock-data:
    seed-on-startup: ${SEED_MOCK_DATA:true}
  auth:
    username: ${APP_AUTH_USERNAME:demo}
    password: ${APP_AUTH_PASSWORD:demo1234}
    token-ttl: ${APP_AUTH_TOKEN_TTL:15m}
