<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PruebasOpenCode1: aplicación web para gestionar personas con React, TypeScript, Vite y Spring Boot."
    />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Aplica la preferencia de tema antes de montar React para evitar parpadeos.
      ;(function () {
        try {
          var tema = localStorage.getItem('pruebasopencode1.tema') || 'sistema'
          var oscuro =
            tema === 'oscuro' ||
            (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro'
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.tema = 'claro'
        }
      })()
    </script>
    <title>PruebasOpenCode1 | Gestión de personas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
